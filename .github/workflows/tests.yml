name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Ensure Playwright dependencies even on cache hit
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          python -m playwright install-deps chromium || true

      - name: Run pytest
        run: |
          pytest -v --tb=short

      - name: Smoke test - --help / --check / --example-config
        run: |
          python vfs_helper.py --help
          python vfs_helper.py --example-config | python -c "import json,sys; json.load(sys.stdin)"
          # --check should run cleanly even though config.json is absent.
          # (--check returns exit code 1 if config is missing; that's fine.)
          python vfs_helper.py --check || true
